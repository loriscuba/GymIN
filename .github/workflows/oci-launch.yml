name: OCI · crea VM ARM quando c'è capacità

# Prova a creare la VM ARM Always Free ogni 10 minuti, dai server di GitHub
# (nessun PC da tenere acceso). Appena c'è capacità la crea e poi diventa un no-op.
# Al primo successo DISATTIVA il workflow: Actions → questo workflow → ⋯ → Disable.
on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti (UTC); può ritardare sotto carico
  workflow_dispatch: {}       # per lanciarlo a mano dal tab Actions

concurrency:
  group: oci-launch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # per aprire l'issue di notifica al successo

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa OCI CLI
        run: pip install --quiet oci-cli

      - name: Configura credenziali OCI
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY_CONTENT" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<CFG
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          fingerprint=$OCI_FINGERPRINT
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          CFG
          chmod 600 ~/.oci/config

      - name: Prova a creare la VM
        id: launch
        env:
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
          OCI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}   # opzionale (default: tenancy)
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}             # consigliato se hai più subnet
          DISPLAY_NAME: gymin-vm
          OCPUS: "1"
          MEMORY_GB: "6"
        run: bash deploy/oci-launch-ci.sh

      - name: Avvisami via email (issue GitHub)
        if: steps.launch.outputs.created == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ip = "${{ steps.launch.outputs.ip }}";
            const ocid = "${{ steps.launch.outputs.ocid }}";
            const owner = context.repo.owner;
            const body = [
              `@${owner} la VM ARM su Oracle è stata **creata** 🎉`,
              ``,
              `- **IP pubblico:** ${ip || '(in provisioning — controlla in console)'}`,
              `- **OCID:** \`${ocid}\``,
              ``,
              ip ? `Connettiti: \`ssh -i ~/.ssh/id_rsa ubuntu@${ip}\`` : ``,
              ``,
              `Prossimi passi: apri **80/443** nella Security List, poi sulla VM \`bash deploy/host-init.sh\`.`,
              ``,
              `➡️ Ora puoi **disattivare questo workflow**: Actions → "OCI · crea VM ARM…" → ⋯ → Disable.`,
            ].join("\n");
            await github.rest.issues.create({
              owner, repo: context.repo.repo,
              title: "✅ VM Oracle creata",
              body, assignees: [owner],
            });
