name: Deploy web su GitHub Pages

# Pubblica su GitHub Pages:
#   - branch main -> https://loriscuba.github.io/GymIN/        (produzione)
#   - branch test -> https://loriscuba.github.io/GymIN/test/   (ambiente di test)
# Gira sempre dal branch main (unico ammesso a pubblicare su Pages) e prende
# entrambi i branch; un push su "test" lo avvia tramite test-deploy.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: prod
      # Collega il sito a Supabase generando web/config.js dalle Variables del repo.
      # La chiave "anon" è pubblica per design (protetta da RLS): va bene esporla nel sito.
      # Se le variabili non sono impostate resta il config.js presente nel repo.
      - name: Config produzione
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf "window.GYMIN_CONFIG = { SUPABASE_URL: '%s', SUPABASE_ANON_KEY: '%s', MAILPIT_URL: '' };\n" \
              "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > prod/web/config.js
            echo "Produzione collegata a Supabase dalle Variables."
          else
            echo "Variabili Supabase assenti: uso il config.js del repo."
          fi

      - name: Scarica il branch test (se esiste)
        id: test
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" test >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch test assente: pubblico solo la produzione."
          fi
      - uses: actions/checkout@v4
        if: steps.test.outputs.exists == 'true'
        with:
          ref: test
          path: testsrc
      # Il sito di test usa SOLO il suo database (SUPABASE_URL_TEST / SUPABASE_ANON_KEY_TEST)
      # e non invia email reali. Senza queste variabili il sito di test non viene pubblicato,
      # così le prove non finiscono mai nei dati di produzione.
      - name: Config test
        if: steps.test.outputs.exists == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL_TEST }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY_TEST }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL_TEST / SUPABASE_ANON_KEY_TEST non impostate: sito di test non pubblicato."
            exit 0
          fi
          printf "window.GYMIN_CONFIG = { SUPABASE_URL: '%s', SUPABASE_ANON_KEY: '%s', MAILPIT_URL: '', MAILER_API_URL: '', ENV: 'test' };\n" \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > testsrc/web/config.js
          # etichetta ben visibile per non confondere test e produzione
          sed -i 's#<title>#<title>[TEST] #' testsrc/web/index.html
          sed -i 's#<body>#<body><div style="position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9999;background:\#d97706;color:\#fff;font:700 12px/1 system-ui,sans-serif;padding:5px 14px;border-radius:0 0 8px 8px;pointer-events:none">AMBIENTE DI TEST</div>#' testsrc/web/index.html
          mkdir -p prod/web/test
          cp -r testsrc/web/. prod/web/test/
          echo "Sito di test pubblicato in /test/."

      # Versione nei link a JS/config: dopo ogni deploy il browser scarica
      # i file nuovi invece di usare quelli vecchi in cache.
      - name: Versiona i file (cache busting)
        run: |
          V="${GITHUB_SHA::8}-$(date +%s)"
          find prod/web -name index.html -o -name '*.js' | xargs sed -i "s/__BUILD__/$V/g"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prod/web
      - id: deployment
        uses: actions/deploy-pages@v4
