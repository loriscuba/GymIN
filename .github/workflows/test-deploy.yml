name: Pubblica ambiente di test

# Un push sul branch "test" rilancia il deploy di Pages dal branch main
# (solo main può pubblicare su GitHub Pages), che include anche /test/.
on:
  push:
    branches: [test]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia "Deploy web su GitHub Pages" su main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
